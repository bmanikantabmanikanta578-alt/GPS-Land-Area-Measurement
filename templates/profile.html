{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow p-4">

<h2 class="mb-4">
User Profile
</h2>

<p>
<strong>Username:</strong>
{{ current_user.username }}
</p>

<p>
<strong>Email:</strong>
{{ current_user.email }}
</p>

<hr>

<h4 class="mb-3">
Upload Profile Picture
</h4>

<form
method="POST"
action="/upload"
enctype="multipart/form-data"
>

<input
type="file"
name="image"
class="form-control mb-3"
required
>

<button class="btn btn-success mb-3">
Upload Image
</button>

</form>

<a href="/dashboard" class="btn btn-primary">
Back To Dashboard
</a>

</div>

</div>

</div>

{% endblock %}
